    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png">

    <meta property="og:site_name" content="Bingo PRO">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pantalla de juego · Bingo PRO">
    <meta name="twitter:description" content="Sigue la partida, los números cantados y el patrón de victoria en tiempo real.">

    <meta name="twitter:image:alt" content="Bingo PRO: bingo multijugador en tiempo real.">

</head>
<body class="proyeccion">

<div id="avisos" class="avisos" role="status" aria-live="polite"></div>

<section id="sinSala" class="puerta" hidden>
    <h1 class="display">Partida no encontrada</h1>
    <p class="apunte">El código <b id="codigoFallido"></b> no corresponde a ninguna partida abierta.</p>
    <a class="boton-enlace" href="/">Volver al inicio</a>
</section>

<div id="app" class="pantalla" hidden>

    <!-- Franja superior -->
    <header class="pantalla-cabecera">
        <h1 class="display">Bingo Pro</h1>

        <div class="datos">
            <span class="dato">
                <span class="punto" id="puntoConexion"></span>
                <span id="textoConexion">En línea</span>
            </span>
            <span class="dato">Sala <b id="codigoSala">—</b></span>
            <span class="dato">Jugando <b id="players">0</b></span>
            <span class="dato"><b id="contador">0</b> / 75 bolas</span>
        </div>

        <button id="vozBtn" class="secundario chico" onclick="alternarVoz(this)">🔇 Voz apagada</button>
    </header>

    <main class="pantalla-cuerpo">

        <!-- Número cantado, lo más grande de la pantalla -->
        <section class="tablero pantalla-numero">
            <p class="etiqueta">Número cantado</p>
            <p class="bola-enorme" id="current" aria-live="polite"></p>
            <div class="ultimas" id="ultimas"></div>
        </section>

        <!-- Patrón y QR -->
        <aside class="pantalla-lado">
            <section class="panel bloque-patron">
                <p class="etiqueta">Patrón de victoria</p>
                <p class="patron-nombre display" id="status">Cartón lleno</p>
                <div class="mini grande" id="miniPatron" aria-hidden="true"></div>
            </section>

            <section class="panel bloque-qr">
                <p class="etiqueta">Únete con el móvil</p>
                <div class="qr" id="qr"></div>
                <p class="codigo-grande" id="codigoQr">—</p>
                <code class="url" id="urlJugar"></code>
            </section>
        </aside>

    </main>

    <!-- Tablero completo 1-75 -->
    <section class="pantalla-tablero">
        <div class="tablero-bolas" id="numbers"></div>
    </section>

</div>

<!-- Celebración a pantalla completa -->
<div id="winner" class="winner celebracion" hidden>
    <div class="celebracion-caja">
        <p class="etiqueta">Tenemos bingo</p>
        <p class="ganador-nombre display" id="ganadorNombre"></p>
        <p class="ganador-sub" id="ganadorSub"></p>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/sala.js"></script>
<script src="/pantalla.js"></script>

</body>
</html>
